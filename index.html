<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will You Go On A Date With Me?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1 id="question">Will you go out with me? ☕</h1>
    <div class="btn-group">
      <button id="yesBtn">Yes! ❤️</button>
      <button id="noBtn">No</button>
    </div>
    <div id="datePlanner" class="hidden">
      <h2>Pick a date activity:</h2>
      <select id="activity">
        <option>Cozy Cafe & Coffee</option>
        <option>Long Drive & Music</option>
        <option>Late Night Dinner</option>
      </select>
      <button id="confirmBtn">Confirm Date</button>
      <p id="finalMsg" class="hidden">It's a plan! Check your WhatsApp/DMs. ✨</p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
